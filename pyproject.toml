[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "container-inspect"
version = "0.1.0"
description = "Inspect Linux containers from the OCI and Linux kernel layers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Arash Hadikhani" }
]

keywords = [
    "containers",
    "linux",
    "oci",
    "docker",
    "podman",
    "runc",
    "crun",
    "devops",
    "container-runtime"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Monitoring"
]

dependencies = []


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10"
]


[project.scripts]
container-inspect = "container_inspect.cli.command:main"


[project.urls]
Homepage = "https://github.com/arashhadikhani-sudo/container-inspect"
Repository = "https://github.com/arashhadikhani-sudo/container-inspect"
Issues = "https://github.com/arashhadikhani-sudo/container-inspect/issues"


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.ruff]
line-length = 88
target-version = "py310"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]


[tool.mypy]
python_version = "3.10"
strict = true
